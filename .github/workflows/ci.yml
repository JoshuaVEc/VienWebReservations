name: CI & Vercel Check

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

jobs:
  quality-and-build:
    name: Typecheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (TypeScript)
        run: npx tsc -b

      - name: Run Automated Backend & Suite Tests
        run: npx tsx api/_tests/backend.test.ts

      - name: Run Automated UI Buttons & Scrollbar Tests
        run: npx tsx api/_tests/ui.test.tsx

      - name: Build project
        run: npm run build
